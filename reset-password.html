<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your JobTrack account password."
    >

    <title>Reset Password | JobTrack</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="password-reset-page">
    <header>
        <nav>
            <h1>JobTrack</h1>

            <a href="index.html">
                Back to JobTrack
            </a>
        </nav>
    </header>

    <main class="password-reset-main">
        <section class="password-reset-card">
            <p>Account recovery</p>

            <h2>Choose a New Password</h2>

            <p>
                Enter and confirm the new password for your
                JobTrack account.
            </p>

            <p
                id="password-reset-status"
                role="status"
                aria-live="polite"
            >
                Checking your password reset link...
            </p>

            <form
                id="password-reset-form"
                hidden
            >
                <div>
                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        id="new-password"
                        name="newPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Enter a new password"
                        required
                    >
                </div>

                <div>
                    <label for="confirm-new-password">
                        Confirm New Password
                    </label>

                    <input
                        id="confirm-new-password"
                        name="confirmNewPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Enter the new password again"
                        required
                    >
                </div>

                <button
                    id="update-password-button"
                    type="submit"
                >
                    Update Password
                </button>
            </form>

            <a
                id="return-to-jobtrack"
                href="index.html"
                hidden
            >
                Return to JobTrack
            </a>
        </section>
    </main>

    <footer>
        <p>
            Job Application Tracker — Built by Didier Iyamuremye
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
